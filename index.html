<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Dino Run - 骨架小恐龙</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            touch-action: manipulation;
        }
        body {
            background: #f0f0f0;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        /* 竖屏时自动旋转为横屏 */
        @media (orientation: portrait) {
            body {
                width: 100vh;
                height: 100vw;
                transform: rotate(90deg);
                transform-origin: 0 0;
                position: absolute;
                top: 0;
                left: 100%;
                margin: 0;
            }
        }
        canvas {
            background: #f0f0f0;
            border: 1px solid #ccc;
            display: block;
            outline: none;
            max-width: 100%;
            height: auto;
            touch-action: manipulation;
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    <script>
        (function() {
            const canvas = document.getElementById('gameCanvas');
            const ctx = canvas.getContext('2d');

            const WIDTH = 800;
            const HEIGHT = 400;
            canvas.width = WIDTH;
            canvas.height = HEIGHT;

            function resize() {
                const isPortrait = window.innerHeight > window.innerWidth;
                const availW = isPortrait ? window.innerHeight : window.innerWidth;
                const availH = isPortrait ? window.innerWidth : window.innerHeight;
                const scale = Math.min(availW / WIDTH, availH / HEIGHT);
                canvas.style.width = (WIDTH * scale) + 'px';
                canvas.style.height = (HEIGHT * scale) + 'px';
            }
            window.addEventListener('resize', resize);
            resize();

            const GROUND_Y = 300;

            // ========== 降低难度参数 ==========
            const GRAVITY = 0.6;        // 重力变小，下落慢
            const JUMP_VEL = -12;       // 跳跃初速稍降，配合重力依然可过障碍
            let speed = 4;              // 初始移动速度更慢
            const SPEED_INC = 0.003;    // 加速更平缓

            let dino = {
                x: 80,
                y: GROUND_Y - 60,
                w: 20,
                h: 60,
                velY: 0,
                onGround: true
            };

            let obstacles = [];
            let score = 0;
            let gameOver = false;
            let started = false;

            let clouds = [];
            for (let i = 0; i < 3; i++) {
                clouds.push({ x: 200 + Math.random() * 600, y: 20 + Math.random() * 80 });
            }

            // ---------- 输入处理 ----------
            function handleInput(e) {
                if (e.cancelable) e.preventDefault();
                if (gameOver) {
                    restart();
                    return;
                }
                if (!started) {
                    started = true;
                    return;
                }
                if (dino.onGround) {
                    dino.velY = JUMP_VEL;
                    dino.onGround = false;
                }
            }

            document.addEventListener('keydown', function(e) {
                if (e.key === ' ' || e.key === 'Space' || 
                    e.key === 'ArrowUp' || e.code === 'Space' || 
                    e.code === 'ArrowUp' || e.keyCode === 32 || e.keyCode === 38) {
                    e.preventDefault();
                    handleInput(e);
                }
            });

            canvas.addEventListener('mousedown', function(e) {
                e.preventDefault();
                handleInput(e);
            });

            canvas.addEventListener('touchstart', function(e) {
                e.preventDefault();
                handleInput(e);
            }, { passive: false });

            canvas.addEventListener('dragstart', function(e) { e.preventDefault(); });

            document.addEventListener('touchmove', function(e) {
                if (e.target === canvas || canvas.contains(e.target)) {
                    e.preventDefault();
                }
            }, { passive: false });

            // ---------- 更新逻辑 ----------
            function updateDino() {
                dino.velY += GRAVITY;
                dino.y += dino.velY;
                if (dino.y >= GROUND_Y - dino.h) {
                    dino.y = GROUND_Y - dino.h;
                    dino.velY = 0;
                    dino.onGround = true;
                }
            }

            function createObstacle() {
                const jumpFrames = (2 * Math.abs(JUMP_VEL)) / GRAVITY;
                const safeGap = speed * jumpFrames * 1.2;
                const minGap = Math.max(150, safeGap);

                if (obstacles.length > 0) {
                    const last = obstacles[obstacles.length - 1];
                    if (last.x + last.w + minGap > WIDTH) return;
                }

                // 降低生成概率
                const prob = 0.015 + score * 0.0002;
                if (Math.random() < prob) {
                    const h = [30, 40, 50][Math.floor(Math.random() * 3)];
                    const w = 12 + Math.floor(Math.random() * 9);
                    obstacles.push({ x: WIDTH, y: GROUND_Y - h, w, h });
                }
            }

            function updateObstacles() {
                for (let obs of obstacles) {
                    obs.x -= speed;
                }
                obstacles = obstacles.filter(obs => obs.x + obs.w > 0);
            }

            function updateClouds() {
                for (let cloud of clouds) {
                    cloud.x -= speed * 0.3;
                }
                clouds = clouds.filter(cloud => cloud.x + 80 > 0);
                if (Math.random() < 0.01) {
                    clouds.push({ x: WIDTH, y: 20 + Math.random() * 100 });
                }
            }

            function checkCollision() {
                const dr = {
                    left: dino.x,
                    top: dino.y,
                    right: dino.x + dino.w,
                    bottom: dino.y + dino.h
                };
                for (let obs of obstacles) {
                    const or = {
                        left: obs.x,
                        top: obs.y,
                        right: obs.x + obs.w,
                        bottom: obs.y + obs.h
                    };
                    if (dr.left < or.right && dr.right > or.left &&
                        dr.top < or.bottom && dr.bottom > or.top) {
                        gameOver = true;
                        break;
                    }
                }
            }

            // ---------- 绘制 ----------
            function drawGround() {
                ctx.strokeStyle = 'gray';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(0, GROUND_Y);
                ctx.lineTo(WIDTH, GROUND_Y);
                ctx.stroke();
            }

            function drawDino() {
                const x = dino.x, y = dino.y, w = dino.w, h = dino.h;
                const bodyHeight = 50;
                ctx.fillStyle = 'black';
                ctx.strokeStyle = 'black';
                ctx.lineWidth = 2;

                // 躯干
                ctx.beginPath();
                ctx.moveTo(x + w/2, y);
                ctx.lineTo(x + w/2, y + bodyHeight);
                ctx.stroke();

                // 头
                ctx.beginPath();
                ctx.arc(x + w/2, y, 5, 0, Math.PI * 2);
                ctx.fill();

                // 腿
                const legTopY = y + bodyHeight;
                const legBottomY = y + h;
                ctx.beginPath();
                ctx.moveTo(x + w/2, legTopY);
                ctx.lineTo(x + w/2 - 8, legBottomY);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(x + w/2, legTopY);
                ctx.lineTo(x + w/2 + 8, legBottomY);
                ctx.stroke();

                // 尾巴
                ctx.beginPath();
                ctx.moveTo(x + w/2, y + 20);
                ctx.lineTo(x + w/2 - 12, y + 10);
                ctx.stroke();
            }

            function drawObstacles() {
                ctx.fillStyle = 'green';
                for (let obs of obstacles) {
                    ctx.fillRect(obs.x, obs.y, obs.w, obs.h);
                }
            }

            function drawClouds() {
                ctx.fillStyle = 'white';
                for (let cloud of clouds) {
                    const cx = cloud.x, cy = cloud.y;
                    const rw = 40, rh = 15;
                    ctx.beginPath();
                    if (ctx.ellipse) {
                        ctx.ellipse(cx, cy, rw, rh, 0, 0, Math.PI * 2);
                    } else {
                        ctx.arc(cx, cy, rh, 0, Math.PI * 2);
                    }
                    ctx.fill();
                }
            }

            function drawUI() {
                ctx.textAlign = 'right';
                ctx.fillStyle = 'black';
                ctx.font = '20px Arial';
                ctx.fillText('Score: ' + Math.floor(score), 780, 30);

                if (!started) {
                    ctx.textAlign = 'center';
                    ctx.font = '28px Arial';
                    ctx.fillText('点击画面 / 按空格开始', WIDTH/2, 180);
                }
                if (gameOver) {
                    ctx.textAlign = 'center';
                    ctx.font = '30px Arial';
                    ctx.fillText('Game Over', WIDTH/2, 180);
                    ctx.font = '20px Arial';
                    ctx.fillText('Score: ' + Math.floor(score), WIDTH/2, 220);
                    ctx.font = '80px Arial';
                    ctx.fillStyle = 'gray';
                    ctx.fillText('这么菜，这就输了啊', WIDTH/2, 300);
                }
            }

            function restart() {
                obstacles = [];
                clouds = [];
                for (let i = 0; i < 3; i++) {
                    clouds.push({ x: 200 + Math.random() * 600, y: 20 + Math.random() * 80 });
                }
                dino.y = GROUND_Y - dino.h;
                dino.velY = 0;
                dino.onGround = true;
                speed = 4;
                score = 0;
                gameOver = false;
                started = true;
            }

            // ---------- 主循环 ----------
            function gameLoop() {
                ctx.clearRect(0, 0, WIDTH, HEIGHT);
                drawGround();
                drawClouds();
                drawObstacles();
                drawDino();
                drawUI();

                if (started && !gameOver) {
                    speed += SPEED_INC;
                    updateDino();
                    createObstacle();
                    updateObstacles();
                    updateClouds();
                    checkCollision();
                    score += 1;
                } else {
                    updateClouds();
                }

                requestAnimationFrame(gameLoop);
            }

            gameLoop();
        })();
    </script>
</body>
</html>
