<!DOCTYPE html>
<html lang="zh">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>ZHZ的盗版游戏</title>
    <style>
        body {
            margin: 0;
            background: #f0f0f0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            touch-action: manipulation;
        }

        canvas {
            background: #f0f0f0;
            border: 1px solid #ccc;
            display: block;
            outline: none;
            max-width: 100%;
            height: auto;
        }
    </style>
</head>

<body>
    <canvas id="gameCanvas"></canvas>
    <script>
        (function () {
            const canvas = document.getElementById('gameCanvas');
            const ctx = canvas.getContext('2d');

            const WIDTH = 800;
            const HEIGHT = 400;
            canvas.width = WIDTH;
            canvas.height = HEIGHT;

            function resize() {
                const scale = Math.min(window.innerWidth / WIDTH, window.innerHeight / HEIGHT);
                canvas.style.width = (WIDTH * scale) + 'px';
                canvas.style.height = (HEIGHT * scale) + 'px';
            }
            window.addEventListener('resize', resize);
            resize();

            const GROUND_Y = 300;

            // 恐龙参数（总高度含腿，躯干高50，腿长10）
            let dino = {
                x: 80,
                y: GROUND_Y - 60,   // 初始时脚底刚好在地面
                w: 20,
                h: 60,              // 总高度（躯干50 + 腿10）
                velY: 0,
                onGround: true
            };
            const GRAVITY = 0.8;
            const JUMP_VEL = -13;

            let obstacles = [];
            let speed = 5;
            let score = 0;
            let gameOver = false;
            let started = false;

            let clouds = [];
            for (let i = 0; i < 3; i++) {
                clouds.push({ x: 200 + Math.random() * 600, y: 20 + Math.random() * 80 });
            }

            // ---------- 输入处理 ----------
            function handleInput(e) {
                e.preventDefault();
                if (gameOver) {
                    restart();
                    return;
                }
                if (!started) {
                    started = true;
                    return;
                }
                if (dino.onGround) {
                    dino.velY = JUMP_VEL;
                    dino.onGround = false;
                }
            }

            document.addEventListener('keydown', function (e) {
                if (e.code === 'Space' || e.code === 'ArrowUp' ||
                    e.key === ' ' || e.key === 'ArrowUp' ||
                    e.keyCode === 32 || e.keyCode === 38) {
                    handleInput(e);
                }
            });

            canvas.addEventListener('mousedown', handleInput);
            canvas.addEventListener('touchstart', handleInput, { passive: false });
            canvas.addEventListener('dragstart', function (e) { e.preventDefault(); });

            // ---------- 更新逻辑 ----------
            function updateDino() {
                dino.velY += GRAVITY;
                dino.y += dino.velY;
                if (dino.y >= GROUND_Y - dino.h) {
                    dino.y = GROUND_Y - dino.h;
                    dino.velY = 0;
                    dino.onGround = true;
                }
            }

            function createObstacle() {
                const jumpFrames = (2 * Math.abs(JUMP_VEL)) / GRAVITY;
                const safeGap = speed * jumpFrames * 1.2;
                const minGap = Math.max(150, safeGap);

                if (obstacles.length > 0) {
                    const last = obstacles[obstacles.length - 1];
                    if (last.x + last.w + minGap > WIDTH) return;
                }

                const prob = 0.02 + score * 0.0003;
                if (Math.random() < prob) {
                    const h = [30, 40, 50][Math.floor(Math.random() * 3)];
                    const w = 12 + Math.floor(Math.random() * 9);
                    obstacles.push({ x: WIDTH, y: GROUND_Y - h, w, h });
                }
            }

            function updateObstacles() {
                for (let obs of obstacles) {
                    obs.x -= speed;
                }
                obstacles = obstacles.filter(obs => obs.x + obs.w > 0);
            }

            function updateClouds() {
                for (let cloud of clouds) {
                    cloud.x -= speed * 0.3;
                }
                clouds = clouds.filter(cloud => cloud.x + 80 > 0);
                if (Math.random() < 0.01) {
                    clouds.push({ x: WIDTH, y: 20 + Math.random() * 100 });
                }
            }

            function checkCollision() {
                const dr = {
                    left: dino.x,
                    top: dino.y,
                    right: dino.x + dino.w,
                    bottom: dino.y + dino.h
                };
                for (let obs of obstacles) {
                    const or = {
                        left: obs.x,
                        top: obs.y,
                        right: obs.x + obs.w,
                        bottom: obs.y + obs.h
                    };
                    if (dr.left < or.right && dr.right > or.left &&
                        dr.top < or.bottom && dr.bottom > or.top) {
                        gameOver = true;
                        break;
                    }
                }
            }

            // ---------- 绘制 ----------
            function drawGround() {
                ctx.strokeStyle = 'gray';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(0, GROUND_Y);
                ctx.lineTo(WIDTH, GROUND_Y);
                ctx.stroke();
            }

            function drawDino() {
                const x = dino.x, y = dino.y, w = dino.w, h = dino.h;
                const bodyHeight = 50;   // 躯干高度
                const legLen = h - bodyHeight; // 腿长
                ctx.fillStyle = 'black';
                ctx.strokeStyle = 'black';
                ctx.lineWidth = 2;

                // 躯干（从头顶到躯干底部）
                ctx.beginPath();
                ctx.moveTo(x + w / 2, y);
                ctx.lineTo(x + w / 2, y + bodyHeight);
                ctx.stroke();

                // 头（在躯干顶部）
                ctx.beginPath();
                ctx.arc(x + w / 2, y, 5, 0, Math.PI * 2);
                ctx.fill();

                // 腿（从躯干底部伸出，末端触碰地面）
                const legTopY = y + bodyHeight;
                const legBottomY = y + h; // 地面
                ctx.beginPath();
                ctx.moveTo(x + w / 2, legTopY);
                ctx.lineTo(x + w / 2 - 8, legBottomY);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(x + w / 2, legTopY);
                ctx.lineTo(x + w / 2 + 8, legBottomY);
                ctx.stroke();

            }

            function drawObstacles() {
                ctx.fillStyle = 'green';
                for (let obs of obstacles) {
                    ctx.fillRect(obs.x, obs.y, obs.w, obs.h);
                }
            }

            function drawClouds() {
                ctx.fillStyle = 'white';
                for (let cloud of clouds) {
                    ctx.beginPath();
                    ctx.ellipse(cloud.x, cloud.y, 40, 15, 0, 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            function drawUI() {
                ctx.textAlign = 'right';
                ctx.fillStyle = 'black';
                ctx.font = '20px Arial';
                ctx.fillText('Score: ' + Math.floor(score), 780, 30);

                if (!started) {
                    ctx.textAlign = 'center';
                    ctx.font = '28px Arial';
                    ctx.fillText('按空格 / 点击画面 开始', WIDTH / 2, 180);
                }
                if (gameOver) {
                    ctx.textAlign = 'center';
                    ctx.font = '30px Arial';
                    ctx.fillText('Game Over', WIDTH / 2, 180);
                    ctx.font = '20px Arial';
                    ctx.fillText('Score: ' + Math.floor(score), WIDTH / 2, 220);
                    ctx.font = '16px Arial';
                    ctx.fillStyle = 'gray';
                    ctx.fillText('按空格 / 点击画面 重新开始', WIDTH / 2, 260);
                }
            }

            function restart() {
                obstacles = [];
                clouds = [];
                for (let i = 0; i < 3; i++) {
                    clouds.push({ x: 200 + Math.random() * 600, y: 20 + Math.random() * 80 });
                }
                dino.y = GROUND_Y - dino.h;
                dino.velY = 0;
                dino.onGround = true;
                speed = 5;
                score = 0;
                gameOver = false;
                started = true;
            }

            // ---------- 主循环 ----------
            function gameLoop() {
                ctx.clearRect(0, 0, WIDTH, HEIGHT);
                drawGround();
                drawClouds();
                drawObstacles();
                drawDino();
                drawUI();

                if (started && !gameOver) {
                    speed += 0.005;
                    updateDino();
                    createObstacle();
                    updateObstacles();
                    updateClouds();
                    checkCollision();
                    score += 0.1;
                } else {
                    updateClouds();
                }

                requestAnimationFrame(gameLoop);
            }

            console.log('🦖 小恐龙游戏已启动，按空格或点击画面开始');
            gameLoop();
        })();
    </script>
</body>

</html>
