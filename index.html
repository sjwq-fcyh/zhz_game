<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Dino Run - 骨架小恐龙</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent; /* 去除点击高亮 */
        }
        body {
            background: #f0f0f0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            touch-action: manipulation; /* 禁止双击缩放 */
        }
        canvas {
            background: #f0f0f0;
            border: 1px solid #ccc;
            display: block;
            outline: none;
            max-width: 100%;
            height: auto;
            touch-action: manipulation; /* 确保 canvas 也能处理触摸 */
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    <script>
        (function() {
            const canvas = document.getElementById('gameCanvas');
            const ctx = canvas.getContext('2d');

            const WIDTH = 800;
            const HEIGHT = 400;
            canvas.width = WIDTH;
            canvas.height = HEIGHT;

            function resize() {
                const scale = Math.min(window.innerWidth / WIDTH, window.innerHeight / HEIGHT);
                canvas.style.width = (WIDTH * scale) + 'px';
                canvas.style.height = (HEIGHT * scale) + 'px';
            }
            window.addEventListener('resize', resize);
            resize();

            const GROUND_Y = 300;

            let dino = {
                x: 80,
                y: GROUND_Y - 60,
                w: 20,
                h: 60,
                velY: 0,
                onGround: true
            };
            const GRAVITY = 0.8;
            const JUMP_VEL = -13;

            let obstacles = [];
            let speed = 5;
            let score = 0;
            let gameOver = false;
            let started = false;

            let clouds = [];
            for (let i = 0; i < 3; i++) {
                clouds.push({ x: 200 + Math.random() * 600, y: 20 + Math.random() * 80 });
            }

            // ---------- 高度兼容的输入处理 ----------
            function handleInput(e) {
                // 阻止默认行为，但要小心不要干扰浏览器
                if (e.cancelable) e.preventDefault();
                
                if (gameOver) {
                    restart();
                    return;
                }
                if (!started) {
                    started = true;
                    return;
                }
                if (dino.onGround) {
                    dino.velY = JUMP_VEL;
                    dino.onGround = false;
                }
            }

            // 键盘事件（电脑端）
            document.addEventListener('keydown', function(e) {
                if (e.key === ' ' || e.key === 'Space' || 
                    e.key === 'ArrowUp' || e.code === 'Space' || 
                    e.code === 'ArrowUp' || e.keyCode === 32 || e.keyCode === 38) {
                    e.preventDefault();
                    handleInput(e);
                }
            });

            // 鼠标点击（电脑端）
            canvas.addEventListener('mousedown', function(e) {
                e.preventDefault();
                handleInput(e);
            });

            // 触摸事件（手机端）—— 注意：passive: false 必须能够调用 preventDefault
            canvas.addEventListener('touchstart', function(e) {
                e.preventDefault(); // 阻止页面拖动
                handleInput(e);
            }, { passive: false });

            // 防止画布被拖拽选中
            canvas.addEventListener('dragstart', function(e) { e.preventDefault(); });

            // 备用：如果某些浏览器还是无法阻止，我们在 document 级别阻止 touchmove
            document.addEventListener('touchmove', function(e) {
                if (e.target === canvas || canvas.contains(e.target)) {
                    e.preventDefault();
                }
            }, { passive: false });

            // ---------- 更新逻辑 ----------
            function updateDino() {
                dino.velY += GRAVITY;
                dino.y += dino.velY;
                if (dino.y >= GROUND_Y - dino.h) {
                    dino.y = GROUND_Y - dino.h;
                    dino.velY = 0;
                    dino.onGround = true;
                }
            }

            function createObstacle() {
                const jumpFrames = (2 * Math.abs(JUMP_VEL)) / GRAVITY;
                const safeGap = speed * jumpFrames * 1.2;
                const minGap = Math.max(150, safeGap);

                if (obstacles.length > 0) {
                    const last = obstacles[obstacles.length - 1];
                    if (last.x + last.w + minGap > WIDTH) return;
                }

                const prob = 0.02 + score * 0.0003;
                if (Math.random() < prob) {
                    const h = [30, 40, 50][Math.floor(Math.random() * 3)];
                    const w = 12 + Math.floor(Math.random() * 9);
                    obstacles.push({ x: WIDTH, y: GROUND_Y - h, w, h });
                }
            }

            function updateObstacles() {
                for (let obs of obstacles) {
                    obs.x -= speed;
                }
                obstacles = obstacles.filter(obs => obs.x + obs.w > 0);
            }

            function updateClouds() {
                for (let cloud of clouds) {
                    cloud.x -= speed * 0.3;
                }
                clouds = clouds.filter(cloud => cloud.x + 80 > 0);
                if (Math.random() < 0.01) {
                    clouds.push({ x: WIDTH, y: 20 + Math.random() * 100 });
                }
            }

            function checkCollision() {
                const dr = {
                    left: dino.x,
                    top: dino.y,
                    right: dino.x + dino.w,
                    bottom: dino.y + dino.h
                };
                for (let obs of obstacles) {
                    const or = {
                        left: obs.x,
                        top: obs.y,
                        right: obs.x + obs.w,
                        bottom: obs.y + obs.h
                    };
                    if (dr.left < or.right && dr.right > or.left &&
                        dr.top < or.bottom && dr.bottom > or.top) {
                        gameOver = true;
                        break;
                    }
                }
            }

            // ---------- 绘制（兼容旧浏览器） ----------
            function drawGround() {
                ctx.strokeStyle = 'gray';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(0, GROUND_Y);
                ctx.lineTo(WIDTH, GROUND_Y);
                ctx.stroke();
            }

            function drawDino() {
                const x = dino.x, y = dino.y, w = dino.w, h = dino.h;
                const bodyHeight = 50;
                ctx.fillStyle = 'black';
                ctx.strokeStyle = 'black';
                ctx.lineWidth = 2;

                // 躯干
                ctx.beginPath();
                ctx.moveTo(x + w/2, y);
                ctx.lineTo(x + w/2, y + bodyHeight);
                ctx.stroke();

                // 头
                ctx.beginPath();
                ctx.arc(x + w/2, y, 5, 0, Math.PI * 2);
                ctx.fill();

                // 腿
                const legTopY = y + bodyHeight;
                const legBottomY = y + h;
                ctx.beginPath();
                ctx.moveTo(x + w/2, legTopY);
                ctx.lineTo(x + w/2 - 8, legBottomY);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(x + w/2, legTopY);
                ctx.lineTo(x + w/2 + 8, legBottomY);
                ctx.stroke();

            }

            function drawObstacles() {
                ctx.fillStyle = 'green';
                for (let obs of obstacles) {
                    ctx.fillRect(obs.x, obs.y, obs.w, obs.h);
                }
            }

            function drawClouds() {
                ctx.fillStyle = 'white';
                for (let cloud of clouds) {
                    ctx.beginPath();
                    // 椭圆 fallback：用圆角矩形或者直接画圆代替（保证兼容）
                    // 这里使用一个简单圆角矩形模拟云朵
                    const cx = cloud.x, cy = cloud.y;
                    const rw = 40, rh = 15;
                    ctx.beginPath();
                    ctx.ellipse ? 
                        ctx.ellipse(cx, cy, rw, rh, 0, 0, Math.PI * 2) :
                        // 如果不支持 ellipse，就用两个弧拼凑
                        (function() {
                            ctx.arc(cx, cy, rh, 0, Math.PI * 2);
                        })();
                    ctx.fill();
                }
            }

            function drawUI() {
                ctx.textAlign = 'right';
                ctx.fillStyle = 'black';
                ctx.font = '20px Arial';
                ctx.fillText('Score: ' + Math.floor(score), 780, 30);

                if (!started) {
                    ctx.textAlign = 'center';
                    ctx.font = '28px Arial';
                    ctx.fillText('点击画面 / 按空格开始', WIDTH/2, 180);
                }
                if (gameOver) {
                    ctx.textAlign = 'center';
                    ctx.font = '30px Arial';
                    ctx.fillText('Game Over', WIDTH/2, 180);
                    ctx.font = '20px Arial';
                    ctx.fillText('Score: ' + Math.floor(score), WIDTH/2, 220);
                    ctx.font = '16px Arial';
                    ctx.fillStyle = 'gray';
                    ctx.fillText('这么菜，这就输了啊', WIDTH/2, 260);
                }
            }

            function restart() {
                obstacles = [];
                clouds = [];
                for (let i = 0; i < 3; i++) {
                    clouds.push({ x: 200 + Math.random() * 600, y: 20 + Math.random() * 80 });
                }
                dino.y = GROUND_Y - dino.h;
                dino.velY = 0;
                dino.onGround = true;
                speed = 5;
                score = 0;
                gameOver = false;
                started = true;
            }

            // ---------- 主循环 ----------
            function gameLoop() {
                ctx.clearRect(0, 0, WIDTH, HEIGHT);
                drawGround();
                drawClouds();
                drawObstacles();
                drawDino();
                drawUI();

                if (started && !gameOver) {
                    speed += 0.01;
                    updateDino();
                    createObstacle();
                    updateObstacles();
                    updateClouds();
                    checkCollision();
                    score += 1;
                } else {
                    updateClouds();
                }

                requestAnimationFrame(gameLoop);
            }

            gameLoop();
        })();
    </script>
</body>
</html>
